
<div class="article-page">
  <div class="container mt-4">
    <div class="row">
      <div class="col-12">
        <div class="card shadow rounded-4 border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="card-title text-success mb-3">{{ article.titre }}</h2>
            <p class="card-text text-muted" [innerHTML]="article.body | markdown | async"></p>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <span *ngFor="let tag of article.tagList" class="badge bg-success-subtle text-success-emphasis rounded-pill px-3 py-2">
                {{ tag }}
              </span>
            </div>
          </div>
          <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center">
            <small class="text-muted">
              <strong>{{ article.author.username }}</strong>

            </small>
            <div>
              <app-follow-button
                [profile]="article.author"
                (toggle)="toggleFollowing($event)">
              </app-follow-button>

              <app-favorite-button
                [article]="article"
                (toggle)="onToggleFavorite($event)">
                {{ article.favorited ? "Unfavorite" : "Favorite" }} ({{ article.favoritesCount }})
              </app-favorite-button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <hr class="my-4"/>

    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div *ifAuthenticated="true">
          <form class="card comment-form shadow-sm mb-4" (ngSubmit)="addComment()">
            <fieldset [disabled]="isSubmitting">
              <div class="card-body">
                <textarea
                  class="form-control mb-3"
                  placeholder="Write a comment..."
                  rows="3"
                  [formControl]="commentControl"></textarea>
                <div class="d-flex justify-content-end align-items-center">
                  <img [src]="currentUser?.image || 'https://via.placeholder.com/40'" class="rounded-circle me-2" width="32" height="32"/>
                  <button class="btn btn-primary btn-sm" type="submit">Post Comment</button>
                </div>
              </div>
            </fieldset>
          </form>
        </div>

        <div *ifAuthenticated="false" class="mb-3">
          <a [routerLink]="['/login']">Sign in</a> or
          <a [routerLink]="['/register']">sign up</a> to add comments.
        </div>

        <div *ngFor="let comment of comments">
          <app-article-comment
            [comment]="comment"
            (delete)="deleteComment(comment)">
          </app-article-comment>
        </div>
      </div>
    </div>
  </div>
</div>
